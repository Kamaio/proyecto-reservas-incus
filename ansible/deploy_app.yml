---
- name: Desplegar aplicación de reservas en app-api
  hosts: api
  become: yes
  tasks:
    - name: Crear directorio de la aplicación
      file:
        path: /opt/app
        state: directory
        mode: '0755'

    - name: Crear archivo main.py
      copy:
        dest: /opt/app/main.py
        content: |
          from fastapi import FastAPI, HTTPException
          from prometheus_client import Counter, generate_latest
          from fastapi.responses import PlainTextResponse
          from pydantic import BaseModel
          from typing import Optional
          import psycopg2

          app = FastAPI(title="API de Reservas")

          requests_total = Counter('reservas_requests_total', 'Total de peticiones')
          reservas_creadas = Counter('reservas_creadas_total', 'Total de reservas creadas')
          errores_total = Counter('reservas_errores_total', 'Total de errores')

          DB_HOST = "10.10.0.4"
          DB_NAME = "reservas"
          DB_USER = "appuser"
          DB_PASS = "password123"

          class RecursoCreate(BaseModel):
              nombre: str
              tipo: str
              disponible: Optional[bool] = True

          class RecursoUpdate(BaseModel):
              nombre: Optional[str] = None
              tipo: Optional[str] = None
              disponible: Optional[bool] = None

          class ReservaCreate(BaseModel):
              recurso_id: int
              usuario: str

          def get_db():
              return psycopg2.connect(
                  host=DB_HOST, dbname=DB_NAME,
                  user=DB_USER, password=DB_PASS
              )

          @app.get("/")
          def root():
              requests_total.inc()
              return {"status": "ok", "servicio": "app-api"}

          @app.get("/health")
          def health():
              return {"status": "healthy"}

          @app.get("/metrics")
          def metrics():
              return PlainTextResponse(generate_latest())

          # ─── CRUD RECURSOS ───────────────────────────────

          @app.get("/recursos")
          def listar_recursos():
              requests_total.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute("SELECT id, nombre, tipo, disponible FROM recursos")
              rows = cur.fetchall()
              conn.close()
              return [{"id": r[0], "nombre": r[1], "tipo": r[2], "disponible": r[3]} for r in rows]

          @app.get("/recursos/{recurso_id}")
          def obtener_recurso(recurso_id: int):
              requests_total.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute("SELECT id, nombre, tipo, disponible FROM recursos WHERE id = %s", (recurso_id,))
              row = cur.fetchone()
              conn.close()
              if not row:
                  errores_total.inc()
                  raise HTTPException(status_code=404, detail="Recurso no encontrado")
              return {"id": row[0], "nombre": row[1], "tipo": row[2], "disponible": row[3]}

          @app.post("/recursos")
          def crear_recurso(recurso: RecursoCreate):
              requests_total.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute(
                  "INSERT INTO recursos (nombre, tipo, disponible) VALUES (%s, %s, %s) RETURNING id",
                  (recurso.nombre, recurso.tipo, recurso.disponible)
              )
              id_recurso = cur.fetchone()[0]
              conn.commit()
              conn.close()
              return {"id": id_recurso, "nombre": recurso.nombre, "tipo": recurso.tipo, "disponible": recurso.disponible}

          @app.put("/recursos/{recurso_id}")
          def actualizar_recurso(recurso_id: int, recurso: RecursoUpdate):
              requests_total.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute("SELECT id, nombre, tipo, disponible FROM recursos WHERE id = %s", (recurso_id,))
              row = cur.fetchone()
              if not row:
                  conn.close()
                  errores_total.inc()
                  raise HTTPException(status_code=404, detail="Recurso no encontrado")
              nuevo_nombre = recurso.nombre if recurso.nombre is not None else row[1]
              nuevo_tipo = recurso.tipo if recurso.tipo is not None else row[2]
              nueva_disponibilidad = recurso.disponible if recurso.disponible is not None else row[3]
              cur.execute(
                  "UPDATE recursos SET nombre=%s, tipo=%s, disponible=%s WHERE id=%s",
                  (nuevo_nombre, nuevo_tipo, nueva_disponibilidad, recurso_id)
              )
              conn.commit()
              conn.close()
              return {"id": recurso_id, "nombre": nuevo_nombre, "tipo": nuevo_tipo, "disponible": nueva_disponibilidad}

          @app.delete("/recursos/{recurso_id}")
          def eliminar_recurso(recurso_id: int):
              requests_total.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute("SELECT id FROM recursos WHERE id = %s", (recurso_id,))
              if not cur.fetchone():
                  conn.close()
                  errores_total.inc()
                  raise HTTPException(status_code=404, detail="Recurso no encontrado")
              cur.execute("DELETE FROM reservas WHERE recurso_id = %s", (recurso_id,))
              cur.execute("DELETE FROM recursos WHERE id = %s", (recurso_id,))
              conn.commit()
              conn.close()
              return {"mensaje": "Recurso eliminado exitosamente"}

          # ─── CRUD RESERVAS ───────────────────────────────

          @app.get("/reservas")
          def listar_reservas():
              requests_total.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute("SELECT id, recurso_id, usuario, fecha FROM reservas")
              rows = cur.fetchall()
              conn.close()
              return [{"id": r[0], "recurso_id": r[1], "usuario": r[2], "fecha": str(r[3])} for r in rows]

          @app.get("/reservas/{reserva_id}")
          def obtener_reserva(reserva_id: int):
              requests_total.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute("SELECT id, recurso_id, usuario, fecha FROM reservas WHERE id = %s", (reserva_id,))
              row = cur.fetchone()
              conn.close()
              if not row:
                  errores_total.inc()
                  raise HTTPException(status_code=404, detail="Reserva no encontrada")
              return {"id": row[0], "recurso_id": row[1], "usuario": row[2], "fecha": str(row[3])}

          @app.post("/reservas")
          def crear_reserva(reserva: ReservaCreate):
              requests_total.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute("SELECT disponible FROM recursos WHERE id = %s", (reserva.recurso_id,))
              recurso = cur.fetchone()
              if not recurso:
                  conn.close()
                  errores_total.inc()
                  raise HTTPException(status_code=404, detail="Recurso no encontrado")
              if not recurso[0]:
                  conn.close()
                  errores_total.inc()
                  raise HTTPException(status_code=400, detail="Recurso no disponible")
              cur.execute(
                  "INSERT INTO reservas (recurso_id, usuario) VALUES (%s, %s) RETURNING id",
                  (reserva.recurso_id, reserva.usuario)
              )
              id_reserva = cur.fetchone()[0]
              cur.execute("UPDATE recursos SET disponible = FALSE WHERE id = %s", (reserva.recurso_id,))
              conn.commit()
              reservas_creadas.inc()
              conn.close()
              return {"id": id_reserva, "recurso_id": reserva.recurso_id, "usuario": reserva.usuario, "mensaje": "Reserva creada exitosamente"}

          @app.put("/reservas/{reserva_id}")
          def actualizar_reserva(reserva_id: int, usuario: str):
              requests_total.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute("SELECT id FROM reservas WHERE id = %s", (reserva_id,))
              if not cur.fetchone():
                  conn.close()
                  errores_total.inc()
                  raise HTTPException(status_code=404, detail="Reserva no encontrada")
              cur.execute("UPDATE reservas SET usuario = %s WHERE id = %s", (usuario, reserva_id))
              conn.commit()
              conn.close()
              return {"id": reserva_id, "usuario": usuario, "mensaje": "Reserva actualizada exitosamente"}

          @app.delete("/reservas/{reserva_id}")
          def cancelar_reserva(reserva_id: int):
              requests_total.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute("SELECT recurso_id FROM reservas WHERE id = %s", (reserva_id,))
              reserva = cur.fetchone()
              if not reserva:
                  conn.close()
                  errores_total.inc()
                  raise HTTPException(status_code=404, detail="Reserva no encontrada")
              cur.execute("UPDATE recursos SET disponible = TRUE WHERE id = %s", (reserva[0],))
              cur.execute("DELETE FROM reservas WHERE id = %s", (reserva_id,))
              conn.commit()
              conn.close()
              return {"mensaje": "Reserva cancelada, recurso disponible nuevamente"}

    - name: Crear servicio systemd para la API
      copy:
        dest: /etc/systemd/system/app-api.service
        content: |
          [Unit]
          Description=API de Reservas
          After=network.target

          [Service]
          WorkingDirectory=/opt/app
          ExecStart=/opt/appenv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reiniciar la API
      systemd:
        name: app-api
        enabled: yes
        state: restarted
        daemon_reload: yes
