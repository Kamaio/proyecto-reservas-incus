---
- name: Desplegar aplicación de reservas en app-api
  hosts: api
  become: yes
  tasks:
    - name: Crear directorio de la aplicación
      file:
        path: /opt/app
        state: directory
        mode: '0755'

    - name: Crear archivo main.py
      copy:
        dest: /opt/app/main.py
        content: |
          from fastapi import FastAPI, HTTPException
          from prometheus_client import Counter, generate_latest
          from fastapi.responses import PlainTextResponse
          import psycopg2
          import os

          app = FastAPI(title="API de Reservas")

          requests_total = Counter('reservas_requests_total', 'Total de peticiones')
          reservas_creadas = Counter('reservas_creadas_total', 'Total de reservas creadas')

          DB_HOST = "10.10.0.4"
          DB_NAME = "reservas"
          DB_USER = "appuser"
          DB_PASS = "password123"

          def get_db():
              return psycopg2.connect(
                  host=DB_HOST, dbname=DB_NAME,
                  user=DB_USER, password=DB_PASS
              )

          @app.get("/")
          def root():
              requests_total.inc()
              return {"status": "ok", "servicio": "app-api"}

          @app.get("/health")
          def health():
              return {"status": "healthy"}

          @app.get("/metrics")
          def metrics():
              return PlainTextResponse(generate_latest())

          @app.get("/recursos")
          def listar_recursos():
              requests_total.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute("SELECT id, nombre, tipo, disponible FROM recursos")
              rows = cur.fetchall()
              conn.close()
              return [{"id": r[0], "nombre": r[1], "tipo": r[2], "disponible": r[3]} for r in rows]

          @app.post("/reservas")
          def crear_reserva(recurso_id: int, usuario: str):
              requests_total.inc()
              reservas_creadas.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute(
                  "INSERT INTO reservas (recurso_id, usuario) VALUES (%s, %s) RETURNING id",
                  (recurso_id, usuario)
              )
              id_reserva = cur.fetchone()[0]
              conn.commit()
              conn.close()
              return {"id": id_reserva, "mensaje": "Reserva creada exitosamente"}

          @app.get("/reservas")
          def listar_reservas():
              requests_total.inc()
              conn = get_db()
              cur = conn.cursor()
              cur.execute("SELECT id, recurso_id, usuario FROM reservas")
              rows = cur.fetchall()
              conn.close()
              return [{"id": r[0], "recurso_id": r[1], "usuario": r[2]} for r in rows]

    - name: Crear servicio systemd para la API
      copy:
        dest: /etc/systemd/system/app-api.service
        content: |
          [Unit]
          Description=API de Reservas
          After=network.target

          [Service]
          WorkingDirectory=/opt/app
          ExecStart=/opt/appenv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Habilitar y arrancar la API
      systemd:
        name: app-api
        enabled: yes
        state: started
        daemon_reload: yes
